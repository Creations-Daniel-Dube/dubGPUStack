[workspace]
resolver = "2"
members = [".", "kernels"]

[package]
name = "dubGPUStack"
version = "1.8.2257"
edition = "2024"
description = "Empilement GPU d'images astronomiques"
publish = false
license = "GPL-3.0-or-later"

[dependencies]
dubgpustack-kernels = { path = "kernels" }
cudarc = { version = "0.19.10", default-features = false, features = ["std", "driver", "nvrtc", "dynamic-loading", "cuda-12000"] }
eframe = "0.37"
png = "0.17"
tiff = "0.9"
rfd = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
ctrlc = "3"
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic", "api-31", "cuda"] }
ureq = { version = "2", default-features = false, features = ["tls"] }

[build-dependencies]
winresource = "0.1"
